[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "instagram-telegram-downloader"
version = "0.1.0"
description = "Telegram-бот для скачивания публичных постов и Reels из Instagram"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiogram==3.30.0",
    "python-dotenv==1.2.2",
    "requests==2.34.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "ruff>=0.11,<1",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
